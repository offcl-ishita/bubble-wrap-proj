<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Wrap Popping!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="game-title">BUBBLE WRAP POPPING!</h1>
        <div class="controls">
            <button id="refill-btn">🔄 Refill Board</button>
        </div>
        <div class="stats">
            <p>Popped: <span id="pop-count">0</span></p>
            <p>Treasures Found: <span id="treasure-stash">None yet...</span></p>
        </div>
    </header>

    <!-- IF THIS LINE IS MISSING, NO BUBBLES WILL LOAD! -->
    <main id="bubble-board"></main>

    <audio id="pop-sound" src="pop.mp3"></audio>
    <script src="script.js"></script>
</body>
</html>
