<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Wrap Popping!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="game-title">BUBBLE WRAP POPPING!</h1>
        
        <!-- All your clickable buttons -->
        <div class="controls">
            <button id="refill-btn">🔄 Refill Board</button>
            <button id="theme-btn">🌙 Dark Mode</button>
            <button id="start-btn">⏱️ Start Time Attack</button>
        </div>
        
        <!-- All your game stats -->
        <div class="stats">
            <div id="timer-display">Time: 60s</div>
            <p>Popped: <span id="pop-count">0</span></p>
            <p>Treasures Found: <span id="treasure-stash">None yet...</span></p>
        </div>
    </header>

    <!-- IF THIS LINE IS MISSING, NO BUBBLES WILL LOAD! -->
    <main id="bubble-board"></main>

    <script src="script.js"></script>
</body>
</html>
